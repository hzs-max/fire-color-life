<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>火彩人生 Fire Color Life</title>
<style>
  :root { --bg:#14121f; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); overflow:hidden;
    font-family:"Courier New", monospace; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas {
    image-rendering:pixelated; image-rendering:crisp-edges;
    background:#0f0d1a;
    max-width:100%; max-height:100%;
    box-shadow:0 0 40px rgba(0,0,0,.6);
  }
  /* Touch controls */
  #touch { position:fixed; inset:0; pointer-events:none; z-index:10; display:none; }
  #touch .pad { position:absolute; bottom:18px; display:flex; gap:12px; pointer-events:auto; }
  #touch .pad.left { left:14px; }
  #touch .pad.right { right:14px; }
  #touch button {
    width:62px; height:62px; border-radius:14px;
    border:2px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12); color:#fff;
    font-size:20px; font-weight:700; font-family:inherit;
    backdrop-filter:blur(4px); touch-action:none; user-select:none;
  }
  #touch button:active { background:rgba(255,255,255,.32); }
  #touch button.fire { border-color:rgba(230,57,70,.7); color:#ffb3ba; }
  @media (pointer:coarse) { #touch { display:block; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>

<div id="touch">
  <div class="pad left">
    <button data-k="ArrowLeft">&#9664;</button>
    <button data-k="ArrowRight">&#9654;</button>
  </div>
  <div class="pad right">
    <button data-k="KeyJ">FIRE</button>
    <button data-k="Space">JUMP</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 480, H = 270;
  const STEP = 1000 / 60;

  const MOODS = {
    anger: { key:'1', name:'ANGER',  zh:'愤怒', color:'#E63946', dark:'#8c1d26' },
    happy: { key:'2', name:'HAPPY',  zh:'开心', color:'#FFC93C', dark:'#b58614' },
    sad:   { key:'3', name:'SAD',    zh:'难过', color:'#3A86FF', dark:'#1d4db0' }
  };
  const MOOD_ORDER = ['anger', 'happy', 'sad'];

  const LEVEL_W = 3200;
  const platforms = [
    { x:0,    y:235, w:530, h:35 },
    { x:600,  y:235, w:380, h:35 },
    { x:1050, y:235, w:430, h:35 },
    { x:1550, y:235, w:370, h:35 },
    { x:1990, y:235, w:510, h:35 },
    { x:2570, y:235, w:630, h:35 },
    { x:300, y:185, w:90, h:12 },
    { x:430, y:150, w:80, h:12 },
    { x:700, y:180, w:100, h:12 },
    { x:900, y:150, w:80, h:12 },
    { x:1150, y:175, w:100, h:12 },
    { x:1380, y:145, w:90, h:12 },
    { x:1650, y:175, w:100, h:12 },
    { x:1850, y:150, w:90, h:12 },
    { x:2100, y:180, w:100, h:12 },
    { x:2320, y:150, w:90, h:12 },
    { x:2650, y:175, w:100, h:12 },
    { x:2850, y:145, w:90, h:12 }
  ];

  function makeEnemies() {
    const defs = [
      { type:'walker', x:360,  y:235 },
      { type:'spit',   x:900,  y:150 },
      { type:'walker', x:760,  y:235 },
      { type:'walker', x:1200, y:235 },
      { type:'spit',   x:1380, y:145 },
      { type:'walker', x:1700, y:235 },
      { type:'spit',   x:1850, y:150 },
      { type:'walker', x:2150, y:235 },
      { type:'spit',   x:2320, y:150 },
      { type:'walker', x:2700, y:235 },
      { type:'walker', x:2950, y:235 },
      { type:'spit',   x:2850, y:145 }
    ];
    return defs.map(function (d, i) {
      return {
        id: i, type: d.type, x: d.x, y: d.y,
        w: d.type === 'walker' ? 16 : 18,
        h: d.type === 'walker' ? 14 : 12,
        hp: d.type === 'walker' ? 50 : 40,
        maxHp: d.type === 'walker' ? 50 : 40,
        dir: -1, cd: 60 + Math.floor(Math.random() * 90),
        bob: Math.floor(Math.random() * 40), dead: false
      };
    });
  }

  let state = 'menu';
  let score = 0;
  let highScore = Number(localStorage.getItem('fcl_high') || 0);
  let cam = { x: 0 };
  let player, rockets, explosions, ebullets, particles, enemies;
  let frameNo = 0;

  function resetGame() {
    player = {
      x: 40, y: 200, w: 14, h: 26,
      vx: 0, vy: 0, facing: 1,
      hp: 100, maxHp: 100,
      mood: 'anger', energy: 100,
      onGround: false, iframe: 0,
      fireCd: 0, walkT: 0,
      safeX: 40, safeY: 200
    };
    rockets = []; explosions = []; ebullets = []; particles = [];
    enemies = makeEnemies();
    score = 0; cam.x = 0; frameNo = 0;
  }

  const keys = {};
  addEventListener('keydown', function (e) {
    keys[e.code] = true;
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code) >= 0) e.preventDefault();
    if (state === 'menu' && (e.code === 'Enter' || e.code === 'Space')) { state = 'play'; resetGame(); }
    else if ((state === 'dead' || state === 'win') && e.code === 'Enter') { state = 'play'; resetGame(); }
    else if (state === 'play') {
      if (e.code === 'Digit1') setMood('anger');
      if (e.code === 'Digit2') setMood('happy');
      if (e.code === 'Digit3') setMood('sad');
      if (e.code === 'KeyP') state = 'paused';
      if (e.code === 'KeyM') toggleMute();
    } else if (state === 'paused' && e.code === 'KeyP') { state = 'play'; }
  });
  addEventListener('keyup', function (e) { keys[e.code] = false; });

  document.querySelectorAll('#touch button').forEach(function (b) {
    const k = b.getAttribute('data-k');
    const down = function (e) { e.preventDefault(); keys[k] = true; };
    const up = function (e) { e.preventDefault(); keys[k] = false; };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('pointerleave', up);
  });

  const moodPillRects = [];
  canvas.addEventListener('pointerdown', function (e) {
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (W / r.width);
    const my = (e.clientY - r.top) * (H / r.height);
    if (state === 'menu') { state = 'play'; resetGame(); return; }
    if (state === 'dead' || state === 'win') { state = 'play'; resetGame(); return; }
    if (state !== 'play') return;
    for (let i = 0; i < moodPillRects.length; i++) {
      const rr = moodPillRects[i];
      if (mx >= rr.x && mx <= rr.x + rr.w && my >= rr.y && my <= rr.y + rr.h) {
        setMood(rr.mood);
        return;
      }
    }
  });

  let actx = null, muted = localStorage.getItem('fcl_mute') === '1';
  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type, vol, slide) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), a.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.08, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  }
  function noise(dur, vol) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, n, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = a.createBufferSource(), g = a.createGain();
    g.gain.setValueAtTime(vol || 0.15, a.currentTime);
    src.buffer = buf; src.connect(g); g.connect(a.destination);
    src.start();
  }
  function toggleMute() {
    muted = !muted;
    localStorage.setItem('fcl_mute', muted ? '1' : '0');
  }
  const sfx = {
    jump:  function () { tone(300, 0.12, 'square', 0.05, 520); },
    shoot: function () { noise(0.12, 0.1); tone(180, 0.1, 'sawtooth', 0.05, 90); },
    boom:  function () { noise(0.35, 0.2); tone(90, 0.3, 'sawtooth', 0.08, 40); },
    hurt:  function () { tone(220, 0.2, 'sawtooth', 0.08, 70); },
    mood:  function () { tone(440, 0.08, 'triangle', 0.06, 660); },
    win:   function () { [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { tone(f, 0.18, 'square', 0.07); }, i * 130); }); }
  };

  function setMood(m) {
    if (player.mood === m) return;
    if (m === 'happy' && player.energy < 12) return;
    player.mood = m;
    sfx.mood();
    const col = MOODS[m].color;
    for (let i = 0; i < 10; i++) {
      particles.push({
        x: player.x + player.w / 2, y: player.y + 8,
        vx: (Math.random() - 0.5) * 2.4, vy: -Math.random() * 2 - 0.5,
        life: 30, max: 30, size: 2, color: col
      });
    }
  }

  function spawnParticles() {
    if (player.mood === 'happy' && frameNo % 6 === 0) {
      particles.push({
        x: player.x + Math.random() * player.w, y: player.y + player.h,
        vx: (Math.random() - 0.5) * 0.6, vy: -0.6 - Math.random() * 0.5,
        life: 40, max: 40, size: 2, color: '#FFE9A8', star: true
      });
    }
    if (player.mood === 'sad' && frameNo % 14 === 0) {
      particles.push({
        x: player.x + 4 + Math.random() * 6, y: player.y + 4,
        vx: -0.3, vy: -0.7,
        life: 46, max: 46, size: 2, color: '#9CC4FF', bubble: true
      });
    }
  }

  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update() {
    frameNo++;
    if (state !== 'play') return;

    const p = player;

    const speedMul = p.mood === 'sad' ? 0.8 : 1;
    const base = 2.3 * speedMul;
    let move = 0;
    if (keys.ArrowLeft || keys.KeyA) move -= 1;
    if (keys.ArrowRight || keys.KeyD) move += 1;
    p.vx = move * base;
    if (move !== 0) { p.facing = move; p.walkT++; } else { p.walkT = 0; }

    if ((keys.Space || keys.ArrowUp || keys.KeyW) && p.onGround) {
      p.vy = -9.2;
      p.onGround = false;
      sfx.jump();
    }

    if (p.fireCd > 0) p.fireCd--;
    if ((keys.KeyJ || keys.KeyK) && p.mood === 'anger' && p.fireCd === 0) {
      p.fireCd = 26;
      const rx = p.facing === 1 ? p.x + p.w : p.x - 10;
      rockets.push({ x: rx, y: p.y + 8, vx: 5.2 * p.facing, life: 70, trail: 0 });
      sfx.shoot();
    }

    p.vy += 0.5;
    if (p.vy > 12) p.vy = 12;

    p.x += p.vx;
    if (p.x < 0) p.x = 0;
    if (p.x + p.w > LEVEL_W) p.x = LEVEL_W - p.w;
    for (let i = 0; i < platforms.length; i++) {
      const pl = platforms[i];
      if (overlap(p, pl)) {
        if (p.vx > 0) p.x = pl.x - p.w;
        else if (p.vx < 0) p.x = pl.x + pl.w;
      }
    }

    p.y += p.vy;
    p.onGround = false;
    for (let i = 0; i < platforms.length; i++) {
      const pl = platforms[i];
      if (overlap(p, pl)) {
        if (p.vy > 0) { p.y = pl.y - p.h; p.vy = 0; p.onGround = true; }
        else if (p.vy < 0) { p.y = pl.y + pl.h; p.vy = 0; }
      }
    }
    if (p.onGround) { p.safeX = p.x; p.safeY = p.y; }

    if (p.y > 290) {
      damagePlayer(18);
      if (p.hp > 0) {
        p.x = p.safeX; p.y = p.safeY - 4; p.vx = 0; p.vy = 0;
      }
    }

    if (p.mood === 'happy') {
      p.energy -= 0.45;
      if (p.energy <= 0) { p.energy = 0; setMood('anger'); }
    } else {
      p.energy = Math.min(100, p.energy + 0.28);
    }
    if (p.iframe > 0) p.iframe--;

    spawnParticles();

    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx; r.life--; r.trail++;
      if (r.trail % 2 === 0) {
        particles.push({
          x: r.x - r.vx * 1.5, y: r.y + 2,
          vx: -0.4, vy: 0.2, life: 16, max: 16, size: 2, color: '#9a948a'
        });
      }
      let hit = false;
      for (let j = 0; j < platforms.length; j++) {
        const pl = platforms[j];
        if (r.x >= pl.x && r.x <= pl.x + pl.w && r.y >= pl.y && r.y <= pl.y + pl.h) { hit = true; break; }
      }
      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (!e.dead && r.x >= e.x && r.x <= e.x + e.w && r.y >= e.y && r.y <= e.y + e.h) { hit = true; break; }
      }
      if (hit || r.life <= 0) {
        explosions.push({ x: r.x, y: r.y + 2, r: 4, t: 0 });
        rockets.splice(i, 1);
        sfx.boom();
      }
    }

    for (let i = explosions.length - 1; i >= 0; i--) {
      const ex = explosions[i];
      if (ex.t === 0) {
        for (let j = 0; j < enemies.length; j++) {
          const e = enemies[j];
          if (e.dead) continue;
          const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
          const dist = Math.hypot(cx - ex.x, cy - ex.y);
          if (dist < 26) {
            e.hp -= 34;
            if (e.hp <= 0) {
              e.dead = true;
              score += 100;
              for (let k = 0; k < 12; k++) {
                particles.push({
                  x: cx, y: cy, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 2.5,
                  life: 26, max: 26, size: 2, color: '#E63946'
                });
              }
            }
          }
        }
      }
      ex.t++; ex.r = 4 + ex.t * 2.4;
      if (ex.t % 2 === 0) {
        particles.push({
          x: ex.x + (Math.random() - 0.5) * ex.r, y: ex.y + (Math.random() - 0.5) * ex.r,
          vx: (Math.random() - 0.5) * 2, vy: -Math.random() * 1.5,
          life: 18, max: 18, size: 2, color: ex.t < 6 ? '#FFC93C' : '#9a948a'
        });
      }
      if (ex.t > 9) explosions.splice(i, 1);
    }

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.dead) continue;
      e.bob++;
      if (e.type === 'walker') {
        e.x += e.dir * 0.7;
        let blocked = false;
        for (let j = 0; j < platforms.length; j++) {
          const pl = platforms[j];
          if (e.x + (e.dir > 0 ? e.w : 0) >= pl.x && e.x + (e.dir > 0 ? e.w : 0) <= pl.x + pl.w &&
              e.y + e.h >= pl.y && e.y + e.h <= pl.y + 6) {
            const aheadX = e.dir > 0 ? e.x + e.w + 4 : e.x - 4;
            if (aheadX < pl.x || aheadX > pl.x + pl.w) blocked = true;
          }
        }
        if (blocked) e.dir *= -1;
      } else {
        e.cd--;
        if (e.cd <= 0) {
          e.cd = 110 + Math.floor(Math.random() * 60);
          const dx = (p.x + p.w / 2) - (e.x + e.w / 2);
          const dy = (p.y + p.h / 2) - (e.y + e.h / 2);
          const d = Math.hypot(dx, dy) || 1;
          if (d < 360) {
            ebullets.push({
              x: e.x + e.w / 2, y: e.y + e.h / 2,
              vx: (dx / d) * 2.2, vy: (dy / d) * 2.2, life: 140
            });
          }
        }
      }
    }

    for (let i = ebullets.length - 1; i >= 0; i--) {
      const b = ebullets[i];
      b.x += b.vx; b.y += b.vy; b.life--;
      let hit = false;
      for (let j = 0; j < platforms.length; j++) {
        const pl = platforms[j];
        if (b.x >= pl.x && b.x <= pl.x + pl.w && b.y >= pl.y && b.y <= pl.y + pl.h) { hit = true; break; }
      }
      if (b.life <= 0 || hit) { ebullets.splice(i, 1); continue; }
      if (overlap({ x: b.x - 2, y: b.y - 2, w: 4, h: 4 }, p)) {
        damagePlayer(10);
        ebullets.splice(i, 1);
      }
    }

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.dead) continue;
      if (overlap(p, e)) {
        damagePlayer(e.type === 'walker' ? 12 : 9);
        const kb = p.mood === 'sad' ? 1.2 : 3;
        p.x += (p.x < e.x ? -kb : kb);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.x += q.vx; q.y += q.vy;
      if (!q.bubble) q.vy += 0.05;
      q.life--;
      if (q.life <= 0) particles.splice(i, 1);
    }

    const target = p.x + p.w / 2 - W / 2;
    cam.x += (target - cam.x) * 0.12;
    cam.x = Math.max(0, Math.min(LEVEL_W - W, cam.x));

    if (p.x + p.w >= 3080) {
      state = 'win';
      if (score > highScore) { highScore = score; localStorage.setItem('fcl_high', String(highScore)); }
      sfx.win();
    }
    if (p.hp <= 0) {
      state = 'dead';
      if (score > highScore) { highScore = score; localStorage.setItem('fcl_high', String(highScore)); }
    }
  }

  function damagePlayer(raw) {
    const p = player;
    if (p.iframe > 0) return;
    let amount = raw;
    if (p.mood === 'happy') amount = 0;
    else if (p.mood === 'sad') amount = raw * 0.25;
    if (amount > 0) {
      p.hp = Math.max(0, p.hp - amount);
      p.iframe = 55;
      sfx.hurt();
    }
  }

  function px(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1b1830');
    g.addColorStop(0.7, '#2a2347');
    g.addColorStop(1, '#3a2c4d');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fdf6d8';
    for (let i = 0; i < 40; i++) {
      const sx = (i * 73) % W;
      const sy = (i * 41) % 150;
      const tw = (frameNo + i * 9) % 60 < 30 ? 1 : 0;
      ctx.globalAlpha = 0.35 + 0.4 * tw;
      ctx.fillRect(sx, sy, 1, 1);
    }
    ctx.globalAlpha = 1;

    const mx = 380 - cam.x * 0.1;
    px(mx, 34, 22, 22, '#f4ead0');
    px(mx + 5, 40, 6, 6, '#d9cdb0');
    px(mx + 13, 50, 4, 4, '#d9cdb0');

    ctx.fillStyle = '#241f3d';
    for (let i = -1; i < 8; i++) {
      const hx = i * 260 - (cam.x * 0.25) % 260;
      ctx.beginPath();
      ctx.moveTo(hx, 235);
      ctx.quadraticCurveTo(hx + 130, 140, hx + 260, 235);
      ctx.fill();
    }
    ctx.fillStyle = '#1c1830';
    for (let i = -1; i < 10; i++) {
      const hx = i * 200 - (cam.x * 0.5) % 200;
      ctx.beginPath();
      ctx.moveTo(hx, 235);
      ctx.quadraticCurveTo(hx + 60, 195, hx + 120, 235);
      ctx.quadraticCurveTo(hx + 160, 205, hx + 200, 235);
      ctx.fill();
    }
  }

  function drawPlatforms() {
    for (let i = 0; i < platforms.length; i++) {
      const pl = platforms[i];
      const x = pl.x - cam.x;
      if (x + pl.w < -10 || x > W + 10) continue;
      px(x, pl.y, pl.w, pl.h, '#4b3f66');
      px(x, pl.y, pl.w, 3, '#6f5f94');
      px(x, pl.y + pl.h - 3, pl.w, 3, '#332b48');
      for (let s = 0; s < pl.w; s += 24) {
        px(x + s + 6, pl.y + 8, 3, 2, '#5b4d7a');
      }
    }
  }

  function drawPortal() {
    const x = 3080 - cam.x;
    const pulse = Math.sin(frameNo * 0.1) * 2;
    px(x - 4, 150, 6, 85, '#7a6aa8');
    px(x + 34, 150, 6, 85, '#7a6aa8');
    px(x - 4, 146, 44, 8, '#9a86c8');
    ctx.fillStyle = '#b9a8ff';
    ctx.globalAlpha = 0.55;
    ctx.fillRect(x + 2, 154, 32 + pulse, 78);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#e6ddff';
    ctx.font = 'bold 9px "Courier New", monospace';
    ctx.fillText('EXIT', x + 6, 142);
  }

  function drawPlayer() {
    const p = player;
    if (p.iframe > 0 && Math.floor(p.iframe / 4) % 2 === 0) return;
    const x = Math.round(p.x - cam.x);
    const y = Math.round(p.y);

    if (p.mood === 'happy') {
      ctx.globalAlpha = 0.35 + 0.2 * Math.sin(frameNo * 0.25);
      px(x - 3, y - 3, p.w + 6, p.h + 6, '#FFC93C');
      ctx.globalAlpha = 1;
    }

    const walk = p.walkT > 0 && p.onGround ? Math.floor(p.walkT / 6) % 2 : 0;
    const skin = '#f2c9a0', hair = '#3a2c22', shirt = '#2A9D8F';

    px(x + 4, y + 18, 3, 8, '#274c63');
    px(x + 8 + (walk ? 1 : 0), y + 18, 3, 8, '#274c63');
    px(x + 4, y + 8, 6, 10, shirt);
    px(x + 2, y + 9, 3, 4, skin);
    px(x + 9, y + 9, 3, 4, skin);
    px(x + 3, y, 8, 8, skin);
    px(x + 3, y, 8, 3, hair);
    px(x + 5, y + 4, 1, 2, '#241a12');
    px(x + 8, y + 4, 1, 2, '#241a12');

    if (p.mood === 'anger') {
      px(x + 3, y + 1, 8, 2, '#E63946');
      px(x + (p.facing === 1 ? 10 : 2), y + 2, 2, 4, '#E63946');
      const ly = y + 9;
      if (p.facing === 1) px(x + 10, ly, 12, 5, '#3a3540');
      else px(x - 8, ly, 12, 5, '#3a3540');
      px(x + (p.facing === 1 ? 20 : -8), ly, 2, 5, '#5a5466');
    } else if (p.mood === 'sad') {
      px(x + 2, y - 1, 10, 4, '#3A86FF');
      px(x + 2, y - 1, 10, 1, '#8fb8ff');
      px(x + 3, y + 8, 8, 8, '#3A86FF');
      px(x + 3, y + 8, 8, 1, '#8fb8ff');
      px(x + 5, y + 6, 4, 1, '#8c1d26');
    } else {
      px(x + 5, y + 6, 4, 1, '#8c5a26');
    }
  }

  function drawEnemies() {
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.dead) continue;
      const x = Math.round(e.x - cam.x);
      if (x + e.w < -10 || x > W + 10) continue;
      const bob = Math.sin(e.bob * 0.1) * 1;
      if (e.type === 'walker') {
        px(x, e.y + bob, e.w, e.h, '#3d2b52');
        px(x, e.y + bob, e.w, 3, '#543c72');
        px(x + 3, e.y + 5 + bob, 2, 2, '#ff5d73');
        px(x + 11, e.y + 5 + bob, 2, 2, '#ff5d73');
        px(x + 5, e.y + 10 + bob, 6, 1, '#241833');
      } else {
        px(x, e.y + bob, e.w, e.h, '#4a2c5c');
        px(x, e.y + bob, e.w, 2, '#67407e');
        px(x + 3, e.y + 4 + bob, 2, 2, '#ffb84d');
        px(x + 13, e.y + 4 + bob, 2, 2, '#ffb84d');
        px(x + 7, e.y + 8 + bob, 4, 2, '#2a1733');
      }
      if (e.hp < e.maxHp) {
        px(x, e.y - 4, e.w, 2, '#2a1733');
        px(x, e.y - 4, Math.round(e.w * (e.hp / e.maxHp)), 2, '#E63946');
      }
    }
  }

  function drawRockets() {
    for (let i = 0; i < rockets.length; i++) {
      const r = rockets[i];
      const x = Math.round(r.x - cam.x), y = Math.round(r.y);
      px(x, y, 8, 4, '#c9443a');
      px(x + (r.vx > 0 ? 8 : -2), y + 1, 2, 2, '#ffd27a');
    }
  }

  function drawEBullets() {
    for (let i = 0; i < ebullets.length; i++) {
      const b = ebullets[i];
      px(b.x - cam.x - 2, b.y - 2, 4, 4, '#c77dff');
      px(b.x - cam.x - 1, b.y - 1, 2, 2, '#f0d4ff');
    }
  }

  function drawExplosions() {
    for (let i = 0; i < explosions.length; i++) {
      const ex = explosions[i];
      const x = ex.x - cam.x;
      ctx.globalAlpha = Math.max(0, 1 - ex.t / 10);
      ctx.fillStyle = '#ffb03a';
      ctx.beginPath();
      ctx.arc(x, ex.y, ex.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff1c2';
      ctx.beginPath();
      ctx.arc(x, ex.y, ex.r * 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const q = particles[i];
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      if (q.star) {
        const x = q.x - cam.x;
        ctx.fillStyle = q.color;
        ctx.fillRect(x - 1, q.y, 3, 1);
        ctx.fillRect(x, q.y - 1, 1, 3);
      } else {
        px(q.x - cam.x, q.y, q.size, q.size, q.color);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawHUD() {
    const p = player;
    ctx.font = 'bold 9px "Courier New", monospace';
    ctx.fillStyle = '#f4ead0';
    ctx.fillText('HP', 10, 16);
    px(26, 9, 100, 8, '#3a2c4d');
    px(26, 9, Math.round(100 * (p.hp / p.maxHp)), 8, p.hp > 30 ? '#52d273' : '#e63946');
    px(26, 9, 100, 1, 'rgba(255,255,255,.25)');

    ctx.fillStyle = '#f4ead0';
    ctx.fillText('SP', 10, 30);
    px(26, 23, 100, 6, '#3a2c4d');
    px(26, 23, Math.round(p.energy), 6, '#FFC93C');

    ctx.fillStyle = '#f4ead0';
    ctx.fillText('SCORE ' + score, W - 110, 16);
    ctx.fillText('BEST ' + highScore, W - 110, 28);

    moodPillRects.length = 0;
    const pw = 64, ph = 26, gap = 6;
    const total = MOOD_ORDER.length * pw + (MOOD_ORDER.length - 1) * gap;
    let bx = (W - total) / 2;
    for (let i = 0; i < MOOD_ORDER.length; i++) {
      const mk = MOOD_ORDER[i];
      const m = MOODS[mk];
      const active = p.mood === mk;
      moodPillRects.push({ x: bx, y: 8, w: pw, h: ph, mood: mk });
      px(bx, 8, pw, ph, active ? m.color : '#2c2542');
      px(bx, 8, pw, 2, active ? '#ffffff66' : '#3d3358');
      ctx.fillStyle = active ? '#1a1526' : '#b8aed4';
      ctx.font = 'bold 9px "Courier New", monospace';
      ctx.fillText(m.name, bx + 12, 19);
      ctx.font = '8px "Courier New", monospace';
      ctx.fillText(m.zh + ' [' + m.key + ']', bx + 8, 29);
      bx += pw + gap;
    }

    if (muted) {
      ctx.fillStyle = '#b8aed4';
      ctx.fillText('MUTED [M]', W - 70, H - 8);
    }
  }

  function drawMenu() {
    ctx.fillStyle = 'rgba(10,8,20,.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 30px "Courier New", monospace';
    ctx.fillStyle = '#ffd27a';
    ctx.fillText('火彩人生', W / 2, 78);
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillStyle = '#f4ead0';
    ctx.fillText('FIRE COLOR LIFE', W / 2, 100);
    ctx.font = '10px "Courier New", monospace';
    ctx.fillStyle = '#b8aed4';
    const help = [
      'Moods are your weapons · 情绪即武器',
      '[1] ANGER = rocket launcher · 愤怒：火箭筒',
      '[2] HAPPY = invincible · 开心：无敌',
      '[3] SAD = blue armor, no damage · 难过：蓝色护甲，不造成伤害',
      'Move: A/D or arrows · Jump: Space · Fire: J',
      'Reach the EXIT portal · 抵达终点传送门'
    ];
    help.forEach(function (t, i) { ctx.fillText(t, W / 2, 128 + i * 15); });
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillStyle = '#52d273';
    if (Math.floor(frameNo / 30) % 2 === 0) ctx.fillText('PRESS ENTER / TAP TO START', W / 2, 240);
    ctx.textAlign = 'left';
  }

  function drawEndOverlay(title, color, sub) {
    ctx.fillStyle = 'rgba(10,8,20,.78)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px "Courier New", monospace';
    ctx.fillStyle = color;
    ctx.fillText(title, W / 2, 110);
    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = '#f4ead0';
    ctx.fillText('SCORE: ' + score + '   BEST: ' + highScore, W / 2, 140);
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.fillStyle = '#52d273';
    if (Math.floor(frameNo / 30) % 2 === 0) ctx.fillText(sub, W / 2, 180);
    ctx.textAlign = 'left';
  }

  function render() {
    drawBackground();
    if (state === 'menu') { drawMenu(); return; }

    drawPlatforms();
    drawPortal();
    drawExplosions();
    drawParticles();
    drawEnemies();
    drawRockets();
    drawEBullets();
    drawPlayer();
    drawHUD();

    if (state === 'dead') drawEndOverlay('GAME OVER', '#ff5d73', 'PRESS ENTER / TAP TO RETRY');
    if (state === 'win') drawEndOverlay('YOU MADE IT!', '#52d273', 'PRESS ENTER / TAP TO PLAY AGAIN');
    if (state === 'paused') {
      ctx.fillStyle = 'rgba(10,8,20,.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillStyle = '#f4ead0';
      ctx.fillText('PAUSED [P]', W / 2, 140);
      ctx.textAlign = 'left';
    }
  }

  let lastTime = performance.now();
  let acc = 0;
  function loop(now) {
    let t = now - lastTime;
    lastTime = now;
    if (t > 100) t = 100;
    acc += t;
    while (acc >= STEP) {
      update();
      acc -= STEP;
    }
    render();
    requestAnimationFrame(loop);
  }
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
