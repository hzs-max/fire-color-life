<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>火彩人生 Fire Color Life</title>
<style>
  :root { --bg:#14121f; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); overflow:hidden;
    font-family:"Courier New", monospace; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas {
    image-rendering:pixelated; image-rendering:crisp-edges;
    background:#0f0d1a; max-width:100%; max-height:100%;
    box-shadow:0 0 40px rgba(0,0,0,.6);
  }
  #touch { position:fixed; inset:0; pointer-events:none; z-index:10; display:none; }
  #touch .pad { position:absolute; bottom:18px; display:flex; gap:12px; pointer-events:auto; }
  #touch .pad.left { left:14px; }
  #touch .pad.right { right:14px; }
  #touch button {
    width:62px; height:62px; border-radius:14px;
    border:2px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12); color:#fff;
    font-size:16px; font-weight:700; font-family:inherit;
    backdrop-filter:blur(4px); touch-action:none; user-select:none;
  }
  #touch button:active { background:rgba(255,255,255,.32); }
  #touch button.fire { border-color:rgba(230,57,70,.7); color:#ffb3ba; }
  @media (pointer:coarse) { #touch { display:block; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>

<div id="touch">
  <div class="pad left">
    <button data-k="ArrowLeft">&#9664;</button>
    <button data-k="ArrowRight">&#9654;</button>
  </div>
  <div class="pad right">
    <button data-k="KeyJ">FIRE</button>
    <button data-k="Space">JUMP</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 480, H = 270;
  const STEP = 1000 / 60;

  const MOODS = {
    anger: { key:'1', name:'ANGER', zh:'愤怒', color:'#E63946' },
    happy: { key:'2', name:'HAPPY', zh:'开心', color:'#FFC93C' },
    sad:   { key:'3', name:'SAD',   zh:'难过', color:'#3A86FF' }
  };
  const MOOD_ORDER = ['anger','happy','sad'];

  // ============================================================
  // Global state
  // ============================================================
  let state = 'cs';                 // cs | play | boss | dead
  let frameNo = 0, score = 0;
  let highScore = Number(localStorage.getItem('fcl_high') || 0);
  let cam = { x: 0 };
  let player, rockets, explosions, ebullets, particles, enemies;
  let stage = 1;
  let boss = null;

  // ============================================================
  // Story cutscenes
  // ============================================================
  const introScenes = [
    { set:'castle', lines:[
      { who:'Narrator', en:'Prince Fiona is locked in a giant castle.', zh:'王子 Fiona 被困在一座超级大城堡里。' },
      { who:'Narrator', en:'A fire dragon guards him so he can never escape.', zh:'一只火龙日夜看守，防止王子逃跑。' } ] },
    { set:'throne', lines:[
      { who:'King', en:'The king calls for a hero to rescue the prince.', zh:'国王召集勇士营救王子、打败火龙。' } ] },
    { set:'throne', lines:[
      { who:'King', en:'It\'s hideous!', zh:'“太丑了！”国王嘴角向下，方块脸厌恶地骂道。' } ] },
    { set:'throne', lines:[
      { who:'Goblin', en:'You can\'t expect a donkey to be handsome!', zh:'哥布林为驴辩护：“你不能对一头驴的颜值要求这么高啊。”' } ] },
    { set:'throne', lines:[
      { who:'King', en:'Donkey, bring Fiona back, and I\'ll give you a whole meadow.', zh:'国王无视了哥布林：“驴，救出王子，我赏你一片草地。”' } ] },
    { set:'throne', lines:[
      { who:'Donkey', en:'Great!', zh:'“Great！”驴子哈喇子流了一地。' } ] },
    { set:'road', lines:[
      { who:'Donkey', en:'Mee-mee-mee... meadow, here I come! Pretty donkeys, here I come!', zh:'一路上驴子哼着歌：“嚒嚒嚒，草地我来了，美驴我也来了！”' } ] },
    { set:'room', pose:'pushup', lines:[
      { who:'Fiona', en:'The Almighty! A cute face will catch that brave heart!', zh:'Fiona 立刻趴地做了 20 个俯卧撑：“用帅气脸蛋抓住那颗不顾危险来救我的心！”' } ] }
  ];

  const midScenes = [
    { set:'gate', lines:[
      { who:'Narrator', en:'Shrek sees the dragon. His heart melts — maybe love, maybe fire.', zh:'Shrek 看到火龙，心化了——也许是被火融化，也许是 fall in love。' } ] },
    { set:'gate', lines:[
      { who:'Narrator', en:'He runs to the dragon... and never comes back. Shrek is out.', zh:'它冲向火龙，再也没有回来。Shrek，out。' } ] },
    { set:'road', pose:'flee', lines:[
      { who:'Narrator', en:'Everyone flees. The dragon burns the road and goes to sleep.', zh:'众人疯狂逃跑，火龙飞上天空烧毁通路，终于安心睡觉。' } ] },
    { set:'room', pose:'sleep', lines:[
      { who:'Fiona', en:'No hero came... hope breaks. He collapses and falls asleep.', zh:'Fiona 没等来盖世英雄，希望碎了，倒下睡着了。' } ] },
    { set:'room', pose:'mirror', lines:[
      { who:'Fiona', en:'Me find hero! I want to go out!', zh:'王子对着魔镜说：“Me find hero！I want to go out！”' } ] },
    { set:'room', pose:'mirror', lines:[
      { who:'Mirror', en:'What the hell?', zh:'魔镜懵了：“What the hell？难道鲁滨逊再世？”' } ] }
  ];

  const endScenes = [
    { set:'gate', pose:'win', lines:[
      { who:'Narrator', en:'The goblin turns back alone and faces the dragon...', zh:'哥布林独自折返，直面火龙。' } ] },
    { set:'end', lines:[
      { who:'Fiona', en:'My hero!', zh:'“我的英雄！”' } ] },
    { set:'end', lines:[
      { who:'Narrator', en:'The goblin rescues Fiona, and they live happily ever after.', zh:'哥布林救出了 Fiona，从此幸福地生活在一起。' } ] }
  ];

  let cs = { list:[], idx:0, char:0, after:null };
  function startCutscene(list, after) {
    cs.list = list; cs.idx = 0; cs.char = 0; cs.after = after; state = 'cs';
  }
  function csCurrent() { return cs.list[cs.idx]; }
  function csText() {
    const l = csCurrent().lines[0];
    return l.who + ' · ' + l.en + '  /  ' + l.zh;
  }
  function advanceCS() {
    const full = csText();
    if (cs.char < full.length) { cs.char = full.length; return; }
    cs.idx++; cs.char = 0;
    if (cs.idx >= cs.list.length) {
      const fn = cs.after; cs.after = null;
      if (fn) fn();
    }
  }

  // ============================================================
  // Stage 1 level
  // ============================================================
  const LEVEL_W = 3200;
  const platforms = [
    { x:0,    y:235, w:530, h:35 },
    { x:600,  y:235, w:380, h:35 },
    { x:1050, y:235, w:430, h:35 },
    { x:1550, y:235, w:370, h:35 },
    { x:1990, y:235, w:510, h:35 },
    { x:2570, y:235, w:630, h:35 },
    { x:300, y:185, w:90, h:12 },
    { x:430, y:150, w:80, h:12 },
    { x:700, y:180, w:100, h:12 },
    { x:900, y:150, w:80, h:12 },
    { x:1150, y:175, w:100, h:12 },
    { x:1380, y:145, w:90, h:12 },
    { x:1650, y:175, w:100, h:12 },
    { x:1850, y:150, w:90, h:12 },
    { x:2100, y:180, w:100, h:12 },
    { x:2320, y:150, w:90, h:12 },
    { x:2650, y:175, w:100, h:12 },
    { x:2850, y:145, w:90, h:12 }
  ];

  function makeEnemies() {
    const defs = [
      { kind:'guard', x:360,  y:235 },
      { kind:'archer', x:430, y:150 },
      { kind:'guard', x:760,  y:235 },
      { kind:'guard', x:1200, y:235 },
      { kind:'archer', x:1380,y:145 },
      { kind:'guard', x:1700, y:235 },
      { kind:'archer', x:1850,y:150 },
      { kind:'guard', x:2150, y:235 },
      { kind:'archer', x:2320,y:150 },
      { kind:'guard', x:2700, y:235 },
      { kind:'guard', x:2950, y:235 }
    ];
    return defs.map(function (d, i) {
      return {
        id:i, kind:d.kind, x:d.x, y:d.y, w:14, h:26,
        hp:50, maxHp:50,
        dir:-1, cd:80 + Math.floor(Math.random()*80),
        walkT:Math.random()*6, dead:false
      };
    });
  }

  function newPlayer() {
    return {
      x:40, y:200, w:14, h:26, vx:0, vy:0, facing:1,
      hp:100, maxHp:100, mood:'anger', energy:100,
      onGround:false, iframe:0, fireCd:0, walkT:0,
      safeX:40, safeY:200
    };
  }

  function startStage1() {
    stage = 1;
    player = newPlayer();
    rockets=[]; explosions=[]; ebullets=[]; particles=[];
    enemies = makeEnemies();
    cam.x = 0;
    state = 'play';
  }

  function startBoss() {
    stage = 2;
    player = newPlayer();
    player.x = 60;
    rockets=[]; explosions=[]; ebullets=[]; particles=[];
    enemies = [];
    cam.x = 0;
    boss = {
      x:330, y:90, hp:300, maxHp:300,
      phase:'idle', t:120, atk:0, flap:0, hurt:0
    };
    state = 'boss';
  }

  // ============================================================
  // Input
  // ============================================================
  const keys = {};
  addEventListener('keydown', function (e) {
    keys[e.code] = true;
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code) >= 0) e.preventDefault();
    if (state === 'cs') {
      if (e.code === 'Enter' || e.code === 'Space') advanceCS();
      return;
    }
    if (state === 'dead' && e.code === 'Enter') { retry(); return; }
    if (state === 'win' && e.code === 'Enter') { restartGame(); return; }
    if (state === 'play' || state === 'boss') {
      if (e.code === 'Digit1') setMood('anger');
      if (e.code === 'Digit2') setMood('happy');
      if (e.code === 'Digit3') setMood('sad');
      if (e.code === 'KeyM') toggleMute();
    }
  });
  addEventListener('keyup', function (e) { keys[e.code] = false; });

  document.querySelectorAll('#touch button').forEach(function (b) {
    const k = b.getAttribute('data-k');
    const down = function (e) { e.preventDefault(); keys[k]=true; };
    const up = function (e) { e.preventDefault(); keys[k]=false; };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('pointerleave', up);
  });

  const moodPillRects = [];
  canvas.addEventListener('pointerdown', function (e) {
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX-r.left)*(W/r.width);
    const my = (e.clientY-r.top)*(H/r.height);
    if (state === 'cs') { advanceCS(); return; }
    if (state === 'dead') { retry(); return; }
    if (state === 'win') { restartGame(); return; }
    if (state !== 'play' && state !== 'boss') return;
    for (let i=0;i<moodPillRects.length;i++) {
      const rr = moodPillRects[i];
      if (mx>=rr.x && mx<=rr.x+rr.w && my>=rr.y && my<=rr.y+rr.h) { setMood(rr.mood); return; }
    }
  });

  // ============================================================
  // Audio
  // ============================================================
  let actx=null, muted = localStorage.getItem('fcl_mute')==='1';
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ actx=null; } }
    if (actx && actx.state==='suspended') actx.resume();
    return actx;
  }
  function tone(freq,dur,type,vol,slide) {
    if (muted) return;
    const a=audio(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(freq,a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(25,slide),a.currentTime+dur);
    g.gain.setValueAtTime(vol||0.07,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur);
  }
  function noise(dur,vol) {
    if (muted) return;
    const a=audio(); if(!a) return;
    const n=Math.floor(a.sampleRate*dur);
    const buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=a.createBufferSource(), g=a.createGain();
    g.gain.setValueAtTime(vol||0.14,a.currentTime);
    src.buffer=buf; src.connect(g); g.connect(a.destination); src.start();
  }
  function toggleMute(){ muted=!muted; localStorage.setItem('fcl_mute',muted?'1':'0'); }
  const sfx = {
    jump:function(){tone(300,0.12,'square',0.05,520);},
    shoot:function(){noise(0.12,0.1);tone(180,0.1,'sawtooth',0.05,90);},
    boom:function(){noise(0.32,0.18);tone(90,0.28,'sawtooth',0.07,40);},
    hurt:function(){tone(220,0.2,'sawtooth',0.07,70);},
    mood:function(){tone(440,0.08,'triangle',0.05,660);},
    roar:function(){noise(0.5,0.16);tone(70,0.5,'sawtooth',0.08,45);},
    win:function(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,0.18,'square',0.06);},i*130);});}
  };

  // ============================================================
  // Mood switching
  // ============================================================
  function setMood(m) {
    if (player.mood===m) return;
    if (m==='happy' && player.energy<12) return;
    player.mood=m; sfx.mood();
    const col=MOODS[m].color;
    for (let i=0;i<8;i++) particles.push({
      x:player.x+player.w/2,y:player.y+10,
      vx:(Math.random()-0.5)*2.2,vy:-Math.random()*1.8,
      life:26,max:26,size:2,color:col
    });
  }

  function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

  // ============================================================
  // Stickman renderer (line-based)
  // ============================================================
  function stickman(x, y, o) {
    o = o || {};
    const f = o.facing||1, sc = o.scale||1;
    const skin=o.skin||'#f2c9a0', cloth=o.cloth||'#2A9D8F', ink=o.ink||'#f4ead0';
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    ctx.scale(f*sc, sc);
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=1.4;
    const hipY=-10, shY=-20, headY=-25, R=4;

    // happy aura
    if (o.aura) {
      ctx.globalAlpha=0.35+0.2*Math.sin(frameNo*0.25);
      ctx.fillStyle='#FFC93C';
      ctx.beginPath(); ctx.arc(0,headY,13,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }

    const moving=o.moving, air=o.air, ph=o.phase||0;
    // legs
    ctx.strokeStyle=ink;
    let a1x=2,a2x=-2,k1x=1,k2x=-1;
    if (air) { a1x=4;a2x=-4;k1x=4;k2x=-4; }
    else if (moving) {
      const sw=Math.sin(ph)*4;
      a1x=sw; a2x=-sw; k1x=sw*0.6; k2x=-sw*0.6;
    }
    line(0,hipY,k1x,hipY+5,a1x,0);
    line(0,hipY,k2x,hipY+5,a2x,0);

    // spine
    ctx.strokeStyle=ink;
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(0,hipY); ctx.stroke();

    // arms
    let w1x=3,w1y=shY+6,w2x=-3,w2y=shY+6;
    if (moving) {
      const sw=-Math.sin(ph)*4;
      w1x=sw; w2x=-sw;
      line(0,shY,sw*0.5,shY+3,sw,shY+6);
      line(0,shY,-sw*0.5,shY+3,-sw,shY+6);
    } else if (air) {
      line(0,shY,5,shY-3,8,shY-5);
      line(0,shY,-5,shY-3,-8,shY-5);
    } else {
      line(0,shY,w1x,shY+3,w1x,shY+6);
      line(0,shY,w2x,shY+3,w2x,shY+6);
    }

    // head
    ctx.fillStyle=skin;
    ctx.strokeStyle=ink;
    ctx.beginPath(); ctx.arc(0,headY,R,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // hair
    ctx.beginPath(); ctx.arc(0,headY,R,Math.PI*1.05,Math.PI*1.95); ctx.stroke();

    // goblin ears
    if (o.ears) {
      ctx.fillStyle=skin;
      tri(-R+0.5,headY-2,-R-3,headY-5,-R-1,headY+1);
      tri(R-0.5,headY-2,R+3,headY-5,R+1,headY+1);
    }
    // crown
    if (o.crown) {
      ctx.strokeStyle='#FFC93C'; ctx.fillStyle='#FFC93C';
      ctx.beginPath();
      ctx.moveTo(-4,headY-R); ctx.lineTo(-4,headY-R-4); ctx.lineTo(-1.5,headY-R-1.5);
      ctx.lineTo(0,headY-R-5); ctx.lineTo(1.5,headY-R-1.5); ctx.lineTo(4,headY-R-4);
      ctx.lineTo(4,headY-R); ctx.closePath(); ctx.stroke();
    }

    // face
    ctx.strokeStyle='#241a12'; ctx.fillStyle='#241a12'; ctx.lineWidth=1;
    if (o.brow==='angry') {
      ctx.beginPath(); ctx.moveTo(-3,headY-1); ctx.lineTo(-1,headY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3,headY-1); ctx.lineTo(1,headY); ctx.stroke();
    }
    if (o.face==='sad') {
      ctx.beginPath(); ctx.arc(0,headY+3,2,Math.PI*0.15,Math.PI*0.85,true); ctx.stroke();
    } else if (o.face==='happy') {
      ctx.beginPath(); ctx.arc(0,headY+1,2,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    } else {
      ctx.fillRect(-2,headY,1,1); ctx.fillRect(1,headY,1,1);
    }

    // mood gear
    if (o.mood==='anger') {
      ctx.strokeStyle='#E63946'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(0,headY,R+1,Math.PI*1.05,Math.PI*1.95); ctx.stroke();
      // rocket launcher held forward
      ctx.fillStyle='#3a3540';
      ctx.fillRect(2,shY-1,13,4);
      ctx.fillStyle='#5a5466';
      ctx.fillRect(13,shY-1,2,4);
    } else if (o.mood==='sad') {
      ctx.fillStyle='#3A86FF';
      ctx.beginPath(); ctx.arc(0,headY,R+1.2,Math.PI,0); ctx.fill();
      ctx.fillRect(-3,shY+1,6,6);
      ctx.fillStyle='#8fb8ff';
      ctx.fillRect(-3,shY+1,6,1);
    }
    ctx.restore();
  }
  function line(x1,y1,x2,y2,x3,y3){
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.stroke();
  }
  function tri(a,b,c,d,e,f){
    ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(c,d); ctx.lineTo(e,f); ctx.closePath(); ctx.fill();
  }

  // ============================================================
  // Donkey (line figure)
  // ============================================================
  function donkey(x, y, o) {
    o = o||{};
    ctx.save(); ctx.translate(Math.round(x),Math.round(y));
    ctx.strokeStyle='#b8b0a4'; ctx.fillStyle='#b8b0a4';
    ctx.lineCap='round'; ctx.lineWidth=1.4;
    // legs
    ctx.beginPath();
    ctx.moveTo(-8,-10); ctx.lineTo(-8,0);
    ctx.moveTo(-3,-10); ctx.lineTo(-3,0);
    ctx.moveTo(3,-10); ctx.lineTo(3,0);
    ctx.moveTo(8,-10); ctx.lineTo(8,0); ctx.stroke();
    // body
    ctx.beginPath(); ctx.moveTo(-10,-10); ctx.lineTo(10,-10); ctx.stroke();
    // neck + head
    ctx.beginPath(); ctx.moveTo(8,-10); ctx.lineTo(12,-20); ctx.lineTo(17,-20); ctx.stroke();
    // snout
    ctx.beginPath(); ctx.moveTo(17,-20); ctx.lineTo(20,-18); ctx.stroke();
    // ears
    ctx.beginPath(); ctx.moveTo(12,-20); ctx.lineTo(10,-25);
    ctx.moveTo(13,-20); ctx.lineTo(14,-25); ctx.stroke();
    // tail
    ctx.beginPath(); ctx.moveTo(-10,-10); ctx.lineTo(-14,-14); ctx.stroke();
    // eye
    ctx.fillStyle='#241a12'; ctx.fillRect(14,-21,1,1);
    // drool
    if (o.drool) {
      ctx.strokeStyle='#9cc4ff'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(20,-17); ctx.lineTo(20,-10+Math.sin(frameNo*0.2)*2); ctx.stroke();
    }
    ctx.restore();
  }

  // ============================================================
  // Dragon (line figure) — boss & cutscenes
  // ============================================================
  function dragon(dx, dy, t, o) {
    o = o||{};
    const scale = o.scale||1;
    ctx.save(); ctx.translate(Math.round(dx),Math.round(dy)); ctx.scale(scale,scale);
    ctx.lineCap='round'; ctx.lineJoin='round';
    const body=[];
    for (let i=1;i<=6;i++) {
      body.push({ x:-i*16, y:Math.sin(t*0.08+i)*7 + i*3 });
    }
    // wings
    const flap=Math.sin(t*0.12)*6;
    ctx.strokeStyle='#7a5a8c'; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(body[1].x,body[1].y);
    ctx.lineTo(body[1].x-18,body[1].y-22-flap);
    ctx.lineTo(body[1].x-2,body[1].y-6);
    ctx.moveTo(body[2].x,body[2].y);
    ctx.lineTo(body[2].x-16,body[2].y-20-flap);
    ctx.lineTo(body[2].x-2,body[2].y-5);
    ctx.stroke();
    // body chain
    ctx.strokeStyle='#c9443a';
    ctx.beginPath(); ctx.moveTo(0,0);
    body.forEach(function(b){ ctx.lineTo(b.x,b.y); }); ctx.stroke();
    // tail spade
    const tb=body[5];
    ctx.fillStyle='#c9443a';
    tri(tb.x,tb.y,tb.x-7,tb.y-3,tb.x-7,tb.y+4);
    // head
    ctx.strokeStyle='#e0554a'; ctx.fillStyle='#e0554a'; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(12,-3); ctx.lineTo(14,2); ctx.lineTo(2,5); ctx.closePath();
    ctx.stroke();
    // horn
    ctx.beginPath(); ctx.moveTo(2,-2); ctx.lineTo(0,-8); ctx.stroke();
    // jaw
    ctx.beginPath(); ctx.moveTo(2,5); ctx.lineTo(12,4); ctx.stroke();
    // eye
    ctx.fillStyle='#ffe9a8'; ctx.fillRect(5,-1,2,2);
    ctx.restore();
  }

  // ============================================================
  // Backgrounds
  // ============================================================
  function sky() {
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1b1830');g.addColorStop(0.7,'#2a2347');g.addColorStop(1,'#3a2c4d');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fdf6d8';
    for (let i=0;i<40;i++){
      const sx=(i*73)%W, sy=(i*41)%150;
      ctx.globalAlpha=0.35+0.4*((frameNo+i*9)%60<30?1:0);
      ctx.fillRect(sx,sy,1,1);
    }
    ctx.globalAlpha=1;
    const mx=380-cam.x*0.1;
    ctx.fillStyle='#f4ead0'; ctx.fillRect(mx,34,22,22);
    ctx.fillStyle='#241f3d';
    for (let i=-1;i<8;i++){
      const hx=i*260-(cam.x*0.25)%260;
      ctx.beginPath(); ctx.moveTo(hx,235);
      ctx.quadraticCurveTo(hx+130,140,hx+260,235); ctx.fill();
    }
    ctx.fillStyle='#1c1830';
    for (let i=-1;i<10;i++){
      const hx=i*200-(cam.x*0.5)%200;
      ctx.beginPath(); ctx.moveTo(hx,235);
      ctx.quadraticCurveTo(hx+60,195,hx+120,235);
      ctx.quadraticCurveTo(hx+160,205,hx+200,235); ctx.fill();
    }
  }

  function drawPlatforms() {
    for (let i=0;i<platforms.length;i++){
      const pl=platforms[i], x=pl.x-cam.x;
      if (x+pl.w<-10||x>W+10) continue;
      ctx.fillStyle='#4b3f66'; ctx.fillRect(x,pl.y,pl.w,pl.h);
      ctx.fillStyle='#6f5f94'; ctx.fillRect(x,pl.y,pl.w,3);
      ctx.fillStyle='#332b48'; ctx.fillRect(x,pl.y+pl.h-3,pl.w,3);
    }
  }

  function drawCastleGate() {
    const x=3100-cam.x;
    ctx.fillStyle='#2c2542';
    ctx.fillRect(x,90,90,145);
    // towers
    ctx.fillRect(x-8,70,20,165);
    ctx.fillRect(x+78,70,20,165);
    // battlements
    for (let i=0;i<5;i++) ctx.fillRect(x-8+i*22,62,12,10);
    // gate
    ctx.fillStyle='#1a1526';
    ctx.beginPath();
    ctx.moveTo(x+20,235); ctx.lineTo(x+20,140);
    ctx.quadraticCurveTo(x+45,115,x+70,140);
    ctx.lineTo(x+70,235); ctx.fill();
    // windows
    ctx.fillStyle='#ffd27a';
    ctx.fillRect(x-3,90,5,8); ctx.fillRect(x+88,90,5,8);
  }

  function bossArena() {
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#221a33');g.addColorStop(1,'#2e2240');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // stone wall blocks
    ctx.fillStyle='#332b48';
    for (let r=0;r<9;r++) for (let c=0;c<12;c++){
      const off=r%2?16:0;
      ctx.fillRect(c*44+off, r*22, 40, 20);
    }
    // torches
    [60,420].forEach(function(tx){
      ctx.fillStyle='#5a5466'; ctx.fillRect(tx,120,4,18);
      ctx.fillStyle='#ffb03a';
      ctx.globalAlpha=0.7+0.3*Math.sin(frameNo*0.3);
      ctx.fillRect(tx-2,112,8,10); ctx.globalAlpha=1;
    });
    // floor
    ctx.fillStyle='#4b3f66'; ctx.fillRect(0,235,W,35);
    ctx.fillStyle='#6f5f94'; ctx.fillRect(0,235,W,3);
  }

  // ============================================================
  // Update: stage 1
  // ============================================================
  function commonPhysics(p) {
    p.vy+=0.5; if(p.vy>12)p.vy=12;
    p.x+=p.vx;
    if(p.x<0)p.x=0;
    if(p.x+p.w>LEVEL_W)p.x=LEVEL_W-p.w;
    for (let i=0;i<platforms.length;i++){
      const pl=platforms[i];
      if(overlap(p,pl)){ if(p.vx>0)p.x=pl.x-p.w; else if(p.vx<0)p.x=pl.x+pl.w; }
    }
    p.y+=p.vy; p.onGround=false;
    for (let i=0;i<platforms.length;i++){
      const pl=platforms[i];
      if(overlap(p,pl)){
        if(p.vy>0){p.y=pl.y-p.h;p.vy=0;p.onGround=true;}
        else if(p.vy<0){p.y=pl.y+pl.h;p.vy=0;}
      }
    }
    if(p.onGround){p.safeX=p.x;p.safeY=p.y;}
  }

  function tryFire(p) {
    if(p.fireCd>0)p.fireCd--;
    if((keys.KeyJ||keys.KeyK)&&p.mood==='anger'&&p.fireCd===0){
      p.fireCd=26;
      const rx=p.facing===1?p.x+p.w:p.x-10;
      rockets.push({x:rx,y:p.y+8,vx:5.2*p.facing,life:70,trail:0});
      sfx.shoot();
    }
  }

  function updateStage1() {
    const p=player;
    const mul=p.mood==='sad'?0.8:1;
    let move=0;
    if(keys.ArrowLeft||keys.KeyA)move-=1;
    if(keys.ArrowRight||keys.KeyD)move+=1;
    p.vx=move*2.3*mul;
    if(move){p.facing=move;p.walkT++;} else p.walkT=0;
    if((keys.Space||keys.ArrowUp||keys.KeyW)&&p.onGround){p.vy=-9.2;p.onGround=false;sfx.jump();}
    tryFire(p);
    commonPhysics(p);

    if(p.y>290){
      damagePlayer(18);
      if(p.hp>0){p.x=p.safeX;p.y=p.safeY-4;p.vx=0;p.vy=0;}
    }
    energyAndIFrame(p);
    ambientParticles(p);

    // enemies
    for (let i=0;i<enemies.length;i++){
      const e=enemies[i]; if(e.dead)continue;
      e.walkT+=0.12;
      if(e.kind==='guard'){
        e.x+=e.dir*0.7;
        let blocked=false;
        for(let j=0;j<platforms.length;j++){
          const pl=platforms[j];
          if(e.x+(e.dir>0?e.w:0)>=pl.x&&e.x+(e.dir>0?e.w:0)<=pl.x+pl.w&&
             e.y+e.h>=pl.y&&e.y+e.h<=pl.y+6){
            const ax=e.dir>0?e.x+e.w+4:e.x-4;
            if(ax<pl.x||ax>pl.x+pl.w)blocked=true;
          }
        }
        if(blocked)e.dir*=-1;
      } else {
        e.cd--;
        if(e.cd<=0){
          e.cd=120;
          const dx=(p.x+p.w/2)-(e.x+e.w/2);
          const d=Math.hypot(dx,1)||1;
          if(d<380) ebullets.push({
            x:e.x+e.w/2,y:e.y+4,
            vx:(dx/d)*2.6,vy:0,life:130,arrow:true
          });
        }
      }
    }
    updateProjectiles(p, true);
    updateParticles();

    const target=p.x+p.w/2-W/2;
    cam.x+=(target-cam.x)*0.12;
    cam.x=Math.max(0,Math.min(LEVEL_W-W,cam.x));

    if(p.x+p.w>=3080) startCutscene(midScenes, startBoss);
    if(p.hp<=0) die();
  }

  // ============================================================
  // Update: boss
  // ============================================================
  function updateBoss() {
    const p=player;
    let move=0;
    if(keys.ArrowLeft||keys.KeyA)move-=1;
    if(keys.ArrowRight||keys.KeyD)move+=1;
    p.vx=move*2.3*(p.mood==='sad'?0.8:1);
    if(move){p.facing=move;p.walkT++;} else p.walkT=0;
    if((keys.Space||keys.ArrowUp||keys.KeyW)&&p.onGround){p.vy=-9.2;p.onGround=false;sfx.jump();}
    tryFire(p);

    // arena physics (floor only)
    p.vy+=0.5; if(p.vy>12)p.vy=12;
    p.x+=p.vx;
    if(p.x<10)p.x=10; if(p.x+p.w>W-10)p.x=W-10-p.w;
    p.y+=p.vy;
    if(p.y+p.h>=235){p.y=235-p.h;p.vy=0;p.onGround=true;} else p.onGround=false;

    energyAndIFrame(p);
    ambientParticles(p);

    // --- dragon AI ---
    boss.t--; boss.flap+=0.12;
    if(boss.hurt>0)boss.hurt--;
    // head tracks player x, hovers
    const wantX=Math.max(200,Math.min(380,p.x+200));
    boss.x+=(wantX-boss.x)*0.03;
    boss.y=90+Math.sin(frameNo*0.05)*10;

    if(boss.phase==='idle'&&boss.t<=0){
      boss.phase='tell'; boss.t=35; boss.atk=Math.random()<0.5?'breath':'balls';
    } else if(boss.phase==='tell'&&boss.t<=0){
      boss.phase='attack'; boss.t=boss.atk==='breath'?70:40;
      sfx.roar();
    } else if(boss.phase==='attack'){
      if(boss.atk==='breath'){
        for(let k=0;k<3;k++) particles.push({
          x:boss.x+14,y:boss.y+3,
          vx:-3.2-Math.random()*1.5,vy:(Math.random()-0.5)*1.6,
          life:26,max:26,size:2,color:Math.random()<0.5?'#ffb03a':'#ff7a3a',flame:true
        });
      } else if(boss.t===39||boss.t===25||boss.t===11){
        for(let k=-1;k<=1;k++) ebullets.push({
          x:boss.x+12,y:boss.y+3,vx:-2.4,vy:k*1.1,life:150,fireball:true
        });
      }
      if(boss.t<=0){boss.phase='idle';boss.t=90;}
    }

    updateProjectiles(p, false);
    updateParticles();

    // flame particle contact
    for(let i=particles.length-1;i>=0;i--){
      const q=particles[i];
      if(q.flame&&overlap({x:q.x-2,y:q.y-2,w:4,h:4},p)){ damagePlayer(11); }
    }
    // dragon head contact
    if(overlap({x:boss.x,y:boss.y,w:16,h:10},p)) damagePlayer(16);

    if(p.hp<=0) die();
    if(boss.hp<=0){
      score+=500;
      startCutscene(endScenes, function(){
        if(score>highScore){highScore=score;localStorage.setItem('fcl_high',String(highScore));}
        sfx.win();
        state='win';
      });
    }
  }

  function energyAndIFrame(p){
    if(p.mood==='happy'){
      p.energy-=0.45;
      if(p.energy<=0){p.energy=0;setMood('anger');}
    } else p.energy=Math.min(100,p.energy+0.28);
    if(p.iframe>0)p.iframe--;
  }

  function ambientParticles(p){
    if(p.mood==='happy'&&frameNo%6===0) particles.push({
      x:p.x+Math.random()*p.w,y:p.y+p.h,
      vx:(Math.random()-0.5)*0.6,vy:-0.8,life:40,max:40,size:2,color:'#FFE9A8',star:true
    });
    if(p.mood==='sad'&&frameNo%14===0) particles.push({
      x:p.x+4+Math.random()*6,y:p.y+4,vx:-0.3,vy:-0.7,
      life:46,max:46,size:2,color:'#9CC4FF',bubble:true
    });
  }

  // rockets, explosions, enemy bullets, contact damage
  function updateProjectiles(p, isStage1) {
    for(let i=rockets.length-1;i>=0;i--){
      const r=rockets[i];
      r.x+=r.vx;r.life--;r.trail++;
      if(r.trail%2===0) particles.push({
        x:r.x-r.vx*1.5,y:r.y+2,vx:-0.4,vy:0.2,
        life:16,max:16,size:2,color:'#9a948a'
      });
      let hit=false;
      if(isStage1){
        for(let j=0;j<platforms.length;j++){
          const pl=platforms[j];
          if(r.x>=pl.x&&r.x<=pl.x+pl.w&&r.y>=pl.y&&r.y<=pl.y+pl.h){hit=true;break;}
        }
        for(let j=0;j<enemies.length;j++){
          const e=enemies[j];
          if(!e.dead&&r.x>=e.x&&r.x<=e.x+e.w&&r.y>=e.y&&r.y<=e.y+e.h){hit=true;break;}
        }
      } else {
        // boss hit region (head + body; jump-shots reach the lower edge)
        if(r.x<=boss.x+30&&r.x>=boss.x-110&&r.y>=boss.y-14&&r.y<=boss.y+110){hit=true;}
      }
      if(hit||r.life<=0){
        explosions.push({x:r.x,y:r.y+2,r:4,t:0});
        rockets.splice(i,1); sfx.boom();
        if(!isStage1&&hit){
          boss.hp-=34; boss.hurt=8;
        }
      }
    }

    for(let i=explosions.length-1;i>=0;i--){
      const ex=explosions[i];
      if(ex.t===0&&isStage1){
        for(let j=0;j<enemies.length;j++){
          const e=enemies[j]; if(e.dead)continue;
          const cx=e.x+e.w/2,cy=e.y+e.h/2;
          if(Math.hypot(cx-ex.x,cy-ex.y)<26){
            e.hp-=34;
            if(e.hp<=0){
              e.dead=true;score+=100;
              for(let k=0;k<10;k++)particles.push({
                x:cx,y:cy,vx:(Math.random()-0.5)*3,vy:-Math.random()*2.5,
                life:24,max:24,size:2,color:'#c9443a'
              });
            }
          }
        }
      }
      ex.t++;ex.r=4+ex.t*2.4;
      if(ex.t%2===0)particles.push({
        x:ex.x+(Math.random()-0.5)*ex.r,y:ex.y+(Math.random()-0.5)*ex.r,
        vx:(Math.random()-0.5)*2,vy:-Math.random()*1.5,
        life:16,max:16,size:2,color:ex.t<6?'#FFC93C':'#9a948a'
      });
      if(ex.t>9)explosions.splice(i,1);
    }

    for(let i=ebullets.length-1;i>=0;i--){
      const b=ebullets[i];
      b.x+=b.vx;b.y+=b.vy;b.life--;
      let hit=false;
      if(isStage1){
        for(let j=0;j<platforms.length;j++){
          const pl=platforms[j];
          if(b.x>=pl.x&&b.x<=pl.x+pl.w&&b.y>=pl.y&&b.y<=pl.y+pl.h){hit=true;break;}
        }
      }
      if(b.life<=0||hit){ebullets.splice(i,1);continue;}
      if(overlap({x:b.x-2,y:b.y-2,w:4,h:4},p)){
        damagePlayer(b.arrow?9:12);
        ebullets.splice(i,1);
      }
    }

    if(isStage1){
      for(let i=0;i<enemies.length;i++){
        const e=enemies[i]; if(e.dead)continue;
        if(overlap(p,e)){
          damagePlayer(11);
          const kb=p.mood==='sad'?1.2:3;
          p.x+=(p.x<e.x?-kb:kb);
        }
      }
    }
  }

  function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
      const q=particles[i];
      q.x+=q.vx;q.y+=q.vy;
      if(!q.bubble&&!q.flame)q.vy+=0.05;
      if(q.flame)q.vx*=0.98;
      q.life--;
      if(q.life<=0)particles.splice(i,1);
    }
  }

  function damagePlayer(raw){
    const p=player;
    if(p.iframe>0)return;
    let amount=raw;
    if(p.mood==='happy')amount=0;
    else if(p.mood==='sad')amount=raw*0.25;
    if(amount>0){
      p.hp=Math.max(0,p.hp-amount);
      p.iframe=55;sfx.hurt();
    }
  }

  function die(){
    state='dead';
    if(score>highScore){highScore=score;localStorage.setItem('fcl_high',String(highScore));}
  }
  function retry(){
    if(stage===1)startStage1(); else startBoss();
  }
  function restartGame(){
    score=0;
    player=newPlayer();
    rockets=[]; explosions=[]; ebullets=[]; particles=[];
    startCutscene(introScenes, startStage1);
  }

  // ============================================================
  // Render: entities
  // ============================================================
  function drawPlayerFigure(){
    const p=player;
    if(p.iframe>0&&Math.floor(p.iframe/4)%2===0)return;
    stickman(p.x+p.w/2-cam.x,p.y+p.h,{
      facing:p.facing,skin:'#8fbf6a',cloth:'#2A9D8F',ink:'#f4ead0',
      moving:p.walkT>0&&p.onGround,air:!p.onGround,phase:p.walkT*0.18,
      ears:true,mood:p.mood,aura:p.mood==='happy'
    });
  }

  function drawEnemyFigures(){
    for(let i=0;i<enemies.length;i++){
      const e=enemies[i];if(e.dead)continue;
      const x=e.x-cam.x;
      if(x<-20||x>W+20)continue;
      stickman(x+e.w/2,e.y+e.h,{
        facing:e.dir,skin:'#6a5a7a',cloth:'#3d2b52',ink:'#c9b8e0',
        moving:e.kind==='guard',phase:e.walkT,brow:'angry',
        face:'sad'
      });
      if(e.kind==='archer'){
        ctx.strokeStyle='#b8b0a4';ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(x+e.w/2-4,e.y+6,5,-1,1);ctx.stroke();
      }
    }
  }

  function drawRockets(){
    for(let i=0;i<rockets.length;i++){
      const r=rockets[i],x=Math.round(r.x-cam.x),y=Math.round(r.y);
      ctx.fillStyle='#c9443a';ctx.fillRect(x,y,8,4);
      ctx.fillStyle='#ffd27a';ctx.fillRect(x+(r.vx>0?8:-2),y+1,2,2);
    }
  }
  function drawEBullets(){
    for(let i=0;i<ebullets.length;i++){
      const b=ebullets[i],x=b.x-cam.x;
      if(b.arrow){
        ctx.strokeStyle='#e6ddff';ctx.lineWidth=1.2;
        ctx.beginPath();ctx.moveTo(x-4,b.y);ctx.lineTo(x+3,b.y);
        ctx.moveTo(x+3,b.y);ctx.lineTo(x,b.y-2);
        ctx.moveTo(x+3,b.y);ctx.lineTo(x,b.y+2);ctx.stroke();
      } else {
        ctx.fillStyle='#ff7a3a';ctx.fillRect(x-2,b.y-2,5,5);
        ctx.fillStyle='#ffd27a';ctx.fillRect(x-1,b.y-1,2,2);
      }
    }
  }
  function drawExplosions(){
    for(let i=0;i<explosions.length;i++){
      const ex=explosions[i],x=ex.x-cam.x;
      ctx.globalAlpha=Math.max(0,1-ex.t/10);
      ctx.fillStyle='#ffb03a';
      ctx.beginPath();ctx.arc(x,ex.y,ex.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff1c2';
      ctx.beginPath();ctx.arc(x,ex.y,ex.r*0.55,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  function drawParticles(){
    for(let i=0;i<particles.length;i++){
      const q=particles[i];
      ctx.globalAlpha=Math.max(0,q.life/q.max);
      if(q.star){
        const x=q.x-cam.x;ctx.fillStyle=q.color;
        ctx.fillRect(x-1,q.y,3,1);ctx.fillRect(x,q.y-1,1,3);
      } else ctx.fillStyle=q.color,ctx.fillRect(q.x-cam.x,q.y,q.size,q.size);
      ctx.globalAlpha=1;
    }
  }

  function drawBoss(){
    if(boss.hurt>0&&Math.floor(boss.hurt/2)%2===0){}
    dragon(boss.x-cam.x,boss.y,frameNo);
    // telegraph
    if(boss.phase==='tell'){
      ctx.fillStyle='#ffe9a8';ctx.font='bold 9px "Courier New",monospace';
      ctx.textAlign='center';
      ctx.fillText(boss.atk==='breath'?'FIRE BREATH!':'FIREBALLS!',boss.x-cam.x,boss.y-12);
      ctx.textAlign='left';
    }
    // boss HP bar
    ctx.fillStyle='#2c2542';ctx.fillRect(70,40,340,8);
    ctx.fillStyle='#E63946';
    ctx.fillRect(70,40,Math.round(340*(boss.hp/boss.maxHp)),8);
    ctx.fillStyle='#f4ead0';ctx.font='bold 9px "Courier New",monospace';
    ctx.fillText('DRAGON',70,36);
  }

  // ============================================================
  // HUD
  // ============================================================
  function drawHUD(){
    const p=player;
    ctx.font='bold 9px "Courier New",monospace';
    ctx.fillStyle='#f4ead0';ctx.fillText('HP',10,16);
    ctx.fillStyle='#3a2c4d';ctx.fillRect(26,9,100,8);
    ctx.fillStyle=p.hp>30?'#52d273':'#e63946';
    ctx.fillRect(26,9,Math.round(100*(p.hp/p.maxHp)),8);
    ctx.fillStyle='#f4ead0';ctx.fillText('SP',10,30);
    ctx.fillStyle='#3a2c4d';ctx.fillRect(26,23,100,6);
    ctx.fillStyle='#FFC93C';ctx.fillRect(26,23,Math.round(p.energy),6);

    ctx.fillStyle='#f4ead0';
    ctx.fillText('SCORE '+score,W-110,16);
    ctx.fillText('BEST '+highScore,W-110,28);

    moodPillRects.length=0;
    const pw=64,ph=26,gap=6;
    let bx=(W-(3*pw+2*gap))/2;
    for(let i=0;i<3;i++){
      const mk=MOOD_ORDER[i],m=MOODS[mk],active=p.mood===mk;
      moodPillRects.push({x:bx,y:8,w:pw,h:ph,mood:mk});
      ctx.fillStyle=active?m.color:'#2c2542';ctx.fillRect(bx,8,pw,ph);
      ctx.fillStyle=active?'#1a1526':'#b8aed4';
      ctx.font='bold 9px "Courier New",monospace';
      ctx.fillText(m.name,bx+12,19);
      ctx.font='8px "Courier New",monospace';
      ctx.fillText(m.zh+' ['+m.key+']',bx+8,29);
      bx+=pw+gap;
    }
    if(muted){ctx.fillStyle='#b8aed4';ctx.fillText('MUTED [M]',W-70,H-8);}
  }

  // ============================================================
  // Cutscene rendering
  // ============================================================
  function csBackdrop(set){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#221c38');g.addColorStop(1,'#352a4f');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#1c1830';
    if(set==='throne'||set==='room'){
      // stone wall
      ctx.fillStyle='#2c2542';
      for(let r=0;r<8;r++)for(let c=0;c<12;c++){
        ctx.fillRect(c*44+(r%2?20:0),r*22,40,20);
      }
    }
    if(set==='castle'||set==='gate'){
      // big castle silhouette
      ctx.fillStyle='#241f3d';
      ctx.fillRect(120,80,260,155);
      ctx.fillRect(100,60,40,175);ctx.fillRect(360,60,40,175);
      for(let i=0;i<8;i++)ctx.fillRect(100+i*36,52,24,10);
    }
    if(set==='road'){
      ctx.fillStyle='#241f3d';
      for(let i=-1;i<8;i++){
        const hx=i*260;
        ctx.beginPath();ctx.moveTo(hx,235);
        ctx.quadraticCurveTo(hx+130,150,hx+260,235);ctx.fill();
      }
    }
    if(set==='end'){
      ctx.fillStyle='#2c2542';
      for(let r=0;r<8;r++)for(let c=0;c<12;c++)ctx.fillRect(c*44+(r%2?20:0),r*22,40,20);
    }
  }

  function csFigures(sc){
    const set=sc.set, pose=sc.pose;
    if(set==='castle'){
      // Fiona in tower window
      stickman(250,170,{skin:'#f2c9a0',ink:'#f4ead0',crown:true,face:'sad'});
      // dragon on roof
      dragon(380,95,frameNo,{scale:0.8});
    }
    if(set==='throne'){
      stickman(150,200,{skin:'#f2c9a0',ink:'#f4ead0',crown:true,face:'sad',brow:'angry'});
      // square head joke: draw a square around head
      ctx.strokeStyle='#f4ead0';ctx.lineWidth=1;
      ctx.strokeRect(145,169,10,10);
      stickman(300,205,{skin:'#8fbf6a',ink:'#f4ead0',ears:true});
      donkey(360,210,{drool:true});
    }
    if(set==='road'){
      if(pose==='flee'){
        stickman(180,205,{skin:'#8fbf6a',ink:'#f4ead0',ears:true,facing:-1,moving:true,phase:frameNo*0.2});
        donkey(280,210,{facing:-1});
      } else {
        stickman(200,205,{skin:'#8fbf6a',ink:'#f4ead0',ears:true,moving:true,phase:frameNo*0.2});
        donkey(290,210,{});
      }
    }
    if(set==='room'){
      if(pose==='pushup'){
        // prone figure: draw small stickman low
        ctx.strokeStyle='#f4ead0';ctx.lineWidth=1.4;
        ctx.beginPath();ctx.moveTo(200,205);ctx.lineTo(260,205);
        ctx.moveTo(215,205);ctx.lineTo(215,215);ctx.moveTo(245,205);ctx.lineTo(245,215);ctx.stroke();
        ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(265,202,5,0,Math.PI*2);ctx.fill();
      } else if(pose==='sleep'){
        stickman(240,205,{skin:'#f2c9a0',ink:'#f4ead0',crown:true,face:'sad'});
      } else if(pose==='mirror'){
        stickman(180,205,{skin:'#f2c9a0',ink:'#f4ead0',crown:true});
        // magic mirror
        ctx.strokeStyle='#9a86c8';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(320,150,34,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle='#b9a8ff';ctx.globalAlpha=0.4;
        ctx.beginPath();ctx.arc(320,150,30,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
        ctx.fillStyle='#241a12';ctx.fillRect(313,148,3,3);ctx.fillRect(325,148,3,3);
      }
    }
    if(set==='gate'){
      if(pose==='win'){
        dragon(340,100,frameNo,{scale:0.9});
        stickman(150,205,{skin:'#8fbf6a',ink:'#f4ead0',ears:true,mood:'anger',moving:true,phase:frameNo*0.2});
      } else {
        dragon(350,95,frameNo,{scale:0.9});
        donkey(220,210,{facing:-1});
      }
    }
    if(set==='end'){
      stickman(200,205,{skin:'#8fbf6a',ink:'#f4ead0',ears:true,face:'happy'});
      stickman(280,205,{skin:'#f2c9a0',ink:'#f4ead0',crown:true,face:'happy'});
    }
  }

  function renderCutscene(){
    const sc=csCurrent();
    csBackdrop(sc.set);
    csFigures(sc);
    // dialogue box
    const l=sc.lines[0];
    ctx.fillStyle='rgba(10,8,20,.82)';
    ctx.fillRect(20,200,440,58);
    ctx.strokeStyle='#6f5f94';ctx.lineWidth=1;
    ctx.strokeRect(20,200,440,58);
    ctx.font='bold 10px "Courier New",monospace';
    ctx.fillStyle='#ffd27a';
    ctx.fillText(l.who,30,214);
    const full=csText();
    const shown=full.slice(0,cs.char);
    ctx.font='9px "Courier New",monospace';
    ctx.fillStyle='#f4ead0';
    wrapText(shown,30,226,420,12);
    ctx.fillStyle='#9a8fc0';ctx.font='8px "Courier New",monospace';
    ctx.textAlign='right';
    if(cs.char>=full.length)ctx.fillText('ENTER / TAP ▶',452,252);
    ctx.textAlign='left';
  }

  function wrapText(t,x,y,maxW,lh){
    let line='';
    for(let i=0;i<t.length;i++){
      const test=line+t[i];
      if(ctx.measureText(test).width>maxW&&i>0){
        ctx.fillText(line,x,y);line=t[i];y+=lh;
      } else line=test;
    }
    ctx.fillText(line,x,y);
  }

  // ============================================================
  // Main render
  // ============================================================
  function renderWin(){
    sky();
    ctx.textAlign='center';
    ctx.font='bold 26px "Courier New",monospace';
    ctx.fillStyle='#ffd36b';
    ctx.fillText('THE END',W/2,100);
    ctx.font='12px "Courier New",monospace';
    ctx.fillStyle='#f4ead0';
    ctx.fillText('The goblin and Fiona live happily ever after.',W/2,132);
    ctx.fillText('SCORE: '+score+'   BEST: '+highScore,W/2,158);
    ctx.font='bold 11px "Courier New",monospace';
    ctx.fillStyle='#52d273';
    if(Math.floor(frameNo/30)%2===0)ctx.fillText('ENTER / TAP TO PLAY AGAIN',W/2,196);
    ctx.textAlign='left';
  }
  function render(){
    if(state==='cs'){renderCutscene();return;}
    if(state==='win'){renderWin();return;}
    if(state==='boss'){
      bossArena();
      drawExplosions();drawParticles();drawRockets();drawEBullets();
      drawBoss();drawPlayerFigure();drawHUD();
    } else {
      sky();drawPlatforms();drawCastleGate();
      drawExplosions();drawParticles();drawEnemyFigures();
      drawRockets();drawEBullets();drawPlayerFigure();drawHUD();
    }
    if(state==='dead'){
      ctx.fillStyle='rgba(10,8,20,.78)';ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      ctx.font='bold 22px "Courier New",monospace';
      ctx.fillStyle='#ff5d73';ctx.fillText('GAME OVER',W/2,110);
      ctx.font='12px "Courier New",monospace';ctx.fillStyle='#f4ead0';
      ctx.fillText('SCORE: '+score+'   BEST: '+highScore,W/2,138);
      ctx.font='bold 11px "Courier New",monospace';ctx.fillStyle='#52d273';
      if(Math.floor(frameNo/30)%2===0)ctx.fillText('ENTER / TAP TO RETRY',W/2,175);
      ctx.textAlign='left';
    }
  }

  // ============================================================
  // Loop
  // ============================================================
  let lastTime=performance.now(),acc=0;
  function loop(now){
    let t=now-lastTime;lastTime=now;
    if(t>100)t=100;acc+=t;
    while(acc>=STEP){
      frameNo++;
      if(state==='play')updateStage1();
      else if(state==='boss')updateBoss();
      else if(state==='cs'&&cs.char<csText().length)cs.char++;
      acc-=STEP;
    }
    render();
    requestAnimationFrame(loop);
  }
  startCutscene(introScenes, startStage1);
  requestAnimationFrame(loop);
})();
</script>
